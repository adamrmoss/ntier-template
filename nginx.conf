# ntier-template site config (included inside http { } via sites-enabled).
# TLS terminates at Cloudflare; origin nginx serves HTTP on port 80 only.
# In Cloudflare: DNS records proxied (orange cloud), SSL/TLS mode Flexible,
# and "Always Use HTTPS" enabled at the edge.
upstream ntier-template-api {
    server 127.0.0.1:5271;
    keepalive 32;
}

# ntier-template.com → static Angular frontend
server {
    listen 80;
    server_name ntier-template.com;

    root /opt/ntier-template/web;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

# www.ntier-template.com → redirect to apex (origin fallback; primary redirect is at Cloudflare)
server {
    listen 80;
    server_name www.ntier-template.com;

    return 301 https://ntier-template.com$request_uri;
}

# api.ntier-template.com → ASP.NET Core backend
server {
    listen 80;
    server_name api.ntier-template.com;

    location / {
        proxy_pass http://ntier-template-api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header Authorization $http_authorization;
    }
}
