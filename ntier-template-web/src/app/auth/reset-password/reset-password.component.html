<section class="auth-page">
    @if (invalidLink)
    {
        <p class="auth-page__error" role="alert">This password reset link is invalid.</p>
    }
    @else
    {
        <form class="auth-page__form" [formGroup]="form" (ngSubmit)="onSubmit()">
            <h1 class="auth-page__heading">Reset password</h1>

            @if (errorMessage)
            {
                <p class="auth-page__error" role="alert">{{ errorMessage }}</p>
            }

            @if (passwordMismatch)
            {
                <p class="auth-page__error" role="alert">Passwords do not match.</p>
            }

            <mat-form-field appearance="outline" class="auth-page__field">
                <mat-label>New password</mat-label>
                <input matInput formControlName="password" type="password" autocomplete="new-password" />
            </mat-form-field>

            <mat-form-field appearance="outline" class="auth-page__field">
                <mat-label>Confirm password</mat-label>
                <input matInput formControlName="confirmPassword" type="password" autocomplete="new-password" />
            </mat-form-field>

            <div class="auth-page__actions">
                <button mat-flat-button type="submit" [disabled]="submitting">Reset password</button>
            </div>
        </form>
    }
</section>
