<section class="home">
    <mat-card appearance="outlined" class="home__card">
        <mat-card-header>
            <mat-card-title>{{ appName }}</mat-card-title>
            <mat-card-subtitle>N-tier .NET and Angular template</mat-card-subtitle>
        </mat-card-header>

        <mat-card-content>
            <p class="home__message">{{ welcomeMessage }}</p>
        </mat-card-content>

        <mat-card-footer class="home__footer">
            <span>&copy; {{ copyrightYear }} {{ appName }}</span>
        </mat-card-footer>
    </mat-card>
</section>
